events { worker_connections 4096; }

http {
  client_max_body_size 50m;

  # "api" resolves to every replica created by `docker compose --scale api=N`
  # (nginx is restarted after scaling so it picks up all replicas)
  upstream api_pool {
    least_conn;
    server api:8000;
  }

  server {
    listen 80;
    location / {
      proxy_pass http://api_pool;
      proxy_set_header Host $host;
      proxy_read_timeout 300s;
    }
  }
}
