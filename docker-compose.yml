# Scale the model service behind an nginx load balancer:
#   docker compose up -d --build --scale api=3
# All replicas share the model, the uploaded data and the SQLite database through
# named volumes, so a model retrained by one replica is hot-reloaded by the others.
services:
  api:
    build: .
    image: bean-leaf-api
    environment:
      - LOG_PREDICTIONS=0
      - DB_PATH=/app/store/mlops.db
      - UPLOAD_DIR=/app/store/uploads
    volumes:
      - models:/app/models
      - store:/app/store
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  models:
  store:
